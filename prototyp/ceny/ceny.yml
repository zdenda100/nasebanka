# Patří do repa jako .github/workflows/ceny.yml
# Každých 30 minut stáhne pohyb cen a uloží ceny.json do větve "data".
# Banka si ho pak čte z https://raw.githubusercontent.com/zdenda100/nasebanka/data/ceny.json
# (zvláštní větev = hlavní větev se nezaplní stovkami commitů a web se pokaždé nepřestaví)
name: Ceny akcií
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ceny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Načíst minulé ceny (kvůli referenčním cenám)
        run: git fetch origin data && git show origin/data:ceny.json > ceny/ceny.json || echo "první spuštění"
      - name: Stáhnout ceny
        run: node ceny/stahni-ceny.mjs
      - name: Uložit do větve data
        run: |
          cp ceny/ceny.json /tmp/ceny.json
          git config user.name "ceny-bot"
          git config user.email "ceny-bot@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -rfq .
          cp /tmp/ceny.json ceny.json
          git add ceny.json
          git commit -qm "Ceny $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq origin data-new:data
