<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0b14">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NašeBanka</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root,:root[data-theme="dark"]{--a1:#22d3ee;--a2:#a855f7;--bg:#0a0b14;--g1:#3b1d6e;--g2:#0b4a5e;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--ink:#ecedf6;--mute:#9aa0b8;--input:rgba(0,0,0,.3);--pos:#4ade80;--neg:#f472b6;--nav:rgba(12,13,24,.85);--glow:rgba(168,85,247,.32);--hi:#c4b5fd;--onacc:#0a0b14;--shadow:none}
:root[data-theme="light"]{--a1:#0891b2;--a2:#9333ea;--bg:#f6f4ff;--g1:#e2d4ff;--g2:#c9f1fa;--panel:rgba(255,255,255,.72);--panel2:#fff;--line:rgba(83,60,170,.13);--ink:#17142b;--mute:#6b6889;--input:#fff;--pos:#059669;--neg:#db2777;--nav:rgba(255,255,255,.88);--glow:rgba(147,51,234,.16);--hi:#7e22ce;--onacc:#fff;--shadow:0 8px 30px rgba(83,60,170,.08)}
html{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100vh;font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 520px at 90% -10%,var(--g1),transparent 65%),radial-gradient(700px 480px at -10% 105%,var(--g2),transparent 60%),var(--bg);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.box{padding:22px}
.gtext{background:linear-gradient(90deg,var(--ink) 30%,var(--hi));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
h3{margin:0 0 12px;font-size:16px;font-weight:600}
.mute{color:var(--mute)}.sm{font-size:13px}.center{text-align:center}
p{margin:0 0 12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:0 8px 24px;text-decoration:none}
.logo i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-style:normal;color:#0a0b14;background:linear-gradient(135deg,#22d3ee,#a855f7)}
.side a.nl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;position:relative}
.side a.nl:hover{color:var(--ink);background:var(--panel2)}
.side a.nl.on{color:var(--ink);background:linear-gradient(90deg,var(--glow),transparent);box-shadow:inset 3px 0 var(--a2)}
.side a.nl.on .ico{color:var(--hi)}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 8px;width:calc(100% - 16px)}
.nbdg{margin-left:auto;background:var(--neg);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
main{padding:28px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:1240px}
.topb{display:flex;align-items:center;gap:12px}
.topb .tt{margin-right:auto;min-width:0}.topb .tt small{display:block;color:var(--mute);font-size:13px}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);position:relative;text-decoration:none;cursor:pointer}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--neg);box-shadow:0 0 8px var(--neg)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0a0b14;background:linear-gradient(135deg,#22d3ee,#a855f7);text-decoration:none;flex-shrink:0}
.r1{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.bn{display:none}

/* components */
.bal small{color:var(--mute);font-size:13px}
.num{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px}
.num.md{font-size:28px}
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mute);text-decoration:none;flex:1 1 90px}
.pill:hover{border-color:var(--a2)}
.pill b{display:block;color:var(--ink);font-size:15px;white-space:nowrap}
.qbox{padding:16px 18px}
.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.q{min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;padding:0}
.q span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--hi);transition:.15s}
.q:hover span{border-color:var(--a2);box-shadow:0 0 18px var(--glow)}
.q.p span{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onacc);border:0;box-shadow:0 6px 22px var(--glow)}
.pc{aspect-ratio:1.586;border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 10px 40px var(--glow);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;background-size:cover;background-position:center}
.pc::after{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(255,255,255,.22),transparent 70%)}
.pc>*{position:relative;z-index:1}
.pc .t{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.chip{width:40px;height:29px;border-radius:6px;background:linear-gradient(135deg,#e2e8f0,#94a3b8)}
.pc .n{font-size:18px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.pc .b{display:flex;justify-content:space-between;font-size:12px;opacity:.85;gap:8px}
.pc .tag{font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.18)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec a{font-size:13px;color:var(--hi);text-decoration:none;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0}
.tx+.tx{border-top:1px solid var(--line)}
.tx .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--hi);flex-shrink:0}
.tx .ic.p{color:var(--pos)}.tx .ic.n{color:var(--neg)}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .m small{font-size:12px;color:var(--mute)}
.tx .a{font-weight:700;font-size:14px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field select{width:100%;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--ink);font-weight:500;font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--a2);box-shadow:0 0 0 3px var(--glow)}
.field select option{background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--a2);margin:10px 0 14px}
.cta{width:100%;padding:13px;border:0;border-radius:14px;font-weight:700;font-size:14px;color:var(--onacc);background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 6px 24px var(--glow);cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.cta:active,.ghost:active{transform:scale(.98)}
.ghost{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.ghost:hover{border-color:var(--a2)}
.ghost.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:11px}
button:disabled{opacity:.5;cursor:not-allowed}
.row2{display:flex;gap:8px}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--mute)}
.seg{display:flex;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--onacc)}
.chart{width:100%;height:110px;display:block;margin:6px 0 4px}
.stock{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:14px;gap:8px}
.stock+.stock{border-top:1px solid var(--line)}
.stock small{display:block;color:var(--mute);font-size:12px}
.prog{height:10px;border-radius:99px;background:var(--input);border:1px solid var(--line);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.empty{color:var(--mute);font-size:14px;padding:10px 0}
/* recipient */
.acctok{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin:-4px 0 12px;font-size:13px}
.acctok.bad{border-color:var(--neg);color:var(--neg)}
.acctok .av{width:28px;height:28px;font-size:12px}
.picker{position:relative}
.pick-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--ink);cursor:pointer;text-align:left;min-height:50px;font-weight:500}
.pick-btn .pm{flex:1;min-width:0;line-height:1.25}.pick-btn .pm b{display:block;font-size:14px}.pick-btn .pm small{font-size:12px;color:var(--mute)}
.pick-btn .ph{color:var(--mute);font-size:14px}
.ghostav{background:var(--panel2)!important;color:var(--mute)!important;border:1px solid var(--line)}
.ghostav .ico{width:16px;height:16px}
.chev{transition:transform .2s;color:var(--mute)}
.picker.open .pick-btn{border-color:var(--a2);box-shadow:0 0 0 3px var(--glow)}
.picker.open .chev{transform:rotate(180deg)}
.pick-pop{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.picker.open .pick-pop{display:block}
.pick-search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px;color:var(--mute)}
.pick-search input{border:0;background:none;outline:none;padding:11px 0;width:100%;color:var(--ink);font-size:14px;font-weight:500}
.pick-list{max-height:290px;overflow-y:auto;overscroll-behavior:contain}
.pick-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:10px 8px 4px}
.pick-row{width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:11px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink)}
.pick-row:hover,.pick-row.act{background:var(--panel2)}
.pick-row .m{flex:1;min-width:0;line-height:1.25}.pick-row .m b{display:block;font-size:14px;font-weight:600}.pick-row small{color:var(--mute);font-size:12px}
.pick-row .acct{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;font-weight:600}
.pick-row.on .acct,.pick-row .ok{color:var(--hi)}
.av.s{width:34px;height:34px;font-size:13px}
.pick-empty{padding:14px 10px;font-size:13px;color:var(--mute)}
.pchip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}
.pchip .av{width:26px;height:26px;font-size:11px}
.pchip.on{border-color:var(--a2);box-shadow:0 0 14px var(--glow)}
/* casino */
.reels{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.reel{width:min(84px,26%);aspect-ratio:.85;border-radius:16px;display:grid;place-items:center;background:var(--input);border:1px solid var(--line);overflow:hidden}
.reel svg{width:56%;height:56%}
.reel.win{box-shadow:0 0 0 2px var(--a2),0 0 24px var(--glow)}
.reel.spin svg{animation:jit .09s linear infinite;filter:blur(1.5px)}
@keyframes jit{0%{transform:translateY(-14%)}100%{transform:translateY(14%)}}
.stake{display:flex;gap:8px;margin-bottom:12px}
.stake button{flex:1;padding:8px 0;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--panel2);cursor:pointer}
.stake button.on{border-color:var(--a2);color:var(--hi);box-shadow:0 0 14px var(--glow)}
.gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glow);color:var(--hi);margin-bottom:10px}
.cd{font-size:26px;font-weight:700;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.scratch{height:92px;border-radius:16px;display:grid;place-items:center;margin:10px 0 12px;font-weight:700;font-size:22px;border:1px dashed var(--line);color:var(--mute);font-size:14px}
.scratch.cover{border:0;cursor:pointer;color:#1a1b22;font-size:15px;background:repeating-linear-gradient(135deg,#cbd5e1 0 10px,#e2e8f0 10px 20px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.scratch.won{border:1px solid var(--a2);color:var(--ink);font-size:26px;box-shadow:0 0 24px var(--glow)}
/* market */
.mkt{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left}
.mi span:last-child{text-align:right}
.mi small{display:block;font-size:12px;color:var(--mute)}
.mi.on{border-color:var(--a2);box-shadow:inset 3px 0 var(--a2)}
/* team */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.person .m{flex:1;min-width:0}.person .m b{display:block;font-size:14px}
.person small{color:var(--mute);font-size:12px}
.role{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:7px;margin-top:3px;background:var(--glow);color:var(--hi)}
.role.k-own{background:rgba(250,204,21,.18);color:#eab308}
.acctin{width:74px;padding:6px 8px;border-radius:9px;border:1px solid var(--a2);background:var(--input);color:var(--ink);font-size:13px}
/* announcements */
.ann{padding:16px 18px;border-radius:18px;background:var(--panel2);border:1px solid var(--line)}
.ann.new{border-color:var(--a2);box-shadow:0 0 18px var(--glow)}
.ann small{color:var(--mute);font-size:12px}
.ann p{margin:6px 0 0;font-size:14px}
/* cards gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gc{border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--panel2);cursor:pointer;text-align:left;font-size:12px;font-weight:600}
.gc .sw{display:block;aspect-ratio:1.586;border-radius:9px;margin-bottom:6px;background-size:cover}
.gc.on{border-color:var(--a2);box-shadow:0 0 14px var(--glow)}
/* toast, sheet, login */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;transition:.25s;z-index:80;padding:12px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);backdrop-filter:blur(16px);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok .ico{color:var(--pos)}.toast.err .ico{color:var(--neg)}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .in{width:100%;padding:10px 16px 34px;border-radius:26px 26px 0 0;background:var(--bg);border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;font-size:13px;font-weight:600;position:relative}
.sheet a .ico{color:var(--hi);width:24px;height:24px}
.sheet a .nbdg{position:absolute;top:8px;right:8px}
.login{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:16px;background:radial-gradient(800px 500px at 80% -10%,var(--g1),transparent 65%),radial-gradient(700px 480px at -10% 105%,var(--g2),transparent 60%),var(--bg)}
.login.open{display:grid}
.login .glass{width:min(400px,100%);padding:28px}
.login .logo{padding:0 0 22px;justify-content:center}
.login h1{margin-bottom:4px}

/* ===== TABLET ===== */
@media (max-width:1099px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .side{padding:20px 0;align-items:center}
  .side .logo{padding:0 0 22px}.side .logo span{display:none}
  .side a.nl{width:62px;flex-direction:column;gap:4px;padding:10px 0;font-size:10.5px;text-align:center}
  .side a.nl.on{box-shadow:none;background:var(--glow)}
  .side .nbdg{position:absolute;top:4px;right:6px;margin:0;font-size:10px;padding:0 5px}
  .side hr{width:40px}
  main{padding:24px 22px}
  .r1{grid-template-columns:minmax(0,1fr) minmax(0,290px);align-items:center}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3>:last-child{grid-column:1/-1}
}
/* ===== PHONE ===== */
@media (max-width:699px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:14px 16px 120px;gap:16px}
  h1{font-size:22px}
  html{scrollbar-width:none}
  .r1,.g2,.g3{grid-template-columns:minmax(0,1fr);gap:16px}
  .g3>:last-child{grid-column:auto}
  .r1 .pc{width:100%;max-width:380px;justify-self:center}
  .num{font-size:36px}
  .box{padding:18px}
  .pills{display:grid;grid-template-columns:1fr 1fr}
  .qbox{padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none}
  .bn{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:60;grid-template-columns:repeat(5,1fr);align-items:end;padding:10px 8px calc(14px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .bn a,.bn button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mute);text-decoration:none;background:none;border:0;cursor:pointer;padding:0;position:relative}
  .bn .on{color:var(--hi)}
  .bn .nbdg{position:absolute;top:-4px;right:calc(50% - 20px);font-size:10px;padding:0 5px}
  .fab{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;margin-top:-34px;color:var(--onacc);background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 28px var(--glow),0 0 0 6px var(--bg)}
  .fab .ico{width:26px;height:26px;stroke-width:2.2}
  .toast{bottom:104px}

<script>
/* ---------- data ---------- */
const CARDS=[

 {n:'Banka',r:'Banka',k:'bank',acct:'1000',card:'gold',hidden:true},

];
['Adam','Anna','Barbora','David','Dominik','Ema','Filip','Hana','Jakub','Jan','Jana','Jiří','Josef','Karolína','Kateřina','Kristýna','Lucie','Lukáš','Marek','Martin','Michal','Natálie','Nikola','Pavel','Radek','Sára','Šimon','Štěpán','Tereza','Vojtěch','Adéla','Daniel','Ester','Patrik','Sofie','Viktor','Zuzana','Libor','Markéta','Roman','Veronika','Vít','Alžběta']
 .forEach((n,i)=>TEAM.push({n:n+' '+'BDFHKLMNPRSTVZ'[i%14]+'.',r:'Zákazník',k:'cust',acct:String(1008+i),card:['neon','aurora','sunset','carbon'][i%4]}));
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
/* Burza: cena v Sh = základ × (skutečná cena teď / skutečná referenční cena).
   Data dodává ceny/ceny.json (stahuje ho ceny/stahni-ceny.mjs, na GitHubu Actions každých 30 min).
   Ve skutečné bance: PRICE_URL = 'https://raw.githubusercontent.com/zdenda100/nasebanka/data/ceny.json' */
const PRICE_URL='ceny/ceny.json',ASSET_URL='ceny/aktiva.json';
const mkSim=(list)=>list.map(([id,n,c,base],i)=>{const r=rng(i*977+13);const h=[];let v=base*.9;for(let k=0;k<30;k++){v*=1+(r()-.47)*.05;h.push(+v.toFixed(2))}return{id,n,c,h,p:h.at(-1),prev:h.at(-2)}});
let ST=mkSim([['AAPL','Apple','Technologie',60],['MSFT','Microsoft','Technologie',75],['KO','Coca-Cola','Jídlo a pití',15],['NKE','Nike','Móda a sport',15],['TSLA','Tesla','Auta',45],['CEZ.PR','ČEZ','Energie',25]]),PRICES={live:false,at:null};
const stk=id=>ST.find(x=>x.id===id);
const chg=s=>(s.p/s.prev-1)*100;
const pct=v=>`${v>=0?'+':''}${v.toFixed(1).replace('.',',')} %`;
async function loadPrices(){try{const [a,c]=await Promise.all([fetch(ASSET_URL).then(r=>r.json()),fetch(PRICE_URL+'?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()})]);
 const next=a.filter(x=>c.assets[x.id]).map(x=>{const d=c.assets[x.id],k=x.base/d.ref,h=d.series.map(s=>+(s[1]*k).toFixed(2)),p=+(d.last*k).toFixed(2);if(Math.abs(h.at(-1)-p)>.005)h.push(p);return{id:x.id,n:x.n,c:x.c,h,p,prev:d.prev*k}});
 if(next.length){ST=next;PRICES={live:true,at:new Date(c.updated)};if(!stk(S.sel))S.sel=ST[0].id}}catch(e){PRICES.live=false}
 const a=document.activeElement;if(['burza','ucet'].includes(route())&&!(a&&/INPUT|SELECT/.test(a.tagName)))render(1)}
const S={me:'Claude',role:'cust',bal:500,sav:0,chips:0,loan:null,lAmt:5000,plan:{amt:1000,date:(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(),freq:'weekly'},hold:{},sel:'AAPL',cat:'all',bq:'',stake:5,reels:['dia','dia','star'],lot:0,scr:null,pre:null,recent:['Matyáš','Ondra','Klára'],unread:2,theme:'dark',fund:48000,fundHist:[41000,42500,41800,44000,45200,44600,46100,47300,46900,48000],bankAccess:['Ondra'],cas:{lost:0,won:0},
 reqs:[{n:'Vojta K.',d:'Dnes 17:40'},{n:'Bára S.',d:'Včera 21:12'}],
 fundTx:[{t:'Poplatky z plateb',w:'za den',a:84.2,d:'Včera'},{t:'Vyplacená půjčka',w:'Petr',a:-3000,d:'Včera'},{t:'Nákup žetonů',w:'Klára',a:510,d:'Včera'},{t:'Splátka půjčky',w:'Ondra',a:1100,d:'18. 11.'}],
 tx:[{k:'int',t:'Úrok ze spoření',d:'Pondělí · spoření',a:170},{k:'out',t:'Matyáš',d:'Včera · za oběd',a:-120},{k:'chip',t:'Směna žetonů',d:'Včera · kasino',a:-204},{k:'inv',t:'Prodej · Apple',d:'18. 11. · investice',a:312.4},{k:'in',t:'Ondra',d:'17. 11. · vrácení',a:50}],
 ann:[{w:'Tomáš',d:'Dnes 18:02',t:'Nová verze banky! Nový vzhled, tmavý i světlý režim a bankovní adresy jako /nasebanka/nastaveni.',n:1},{w:'Ondra',d:'Včera',t:'Loterie dnes ve 20:00 – v banku je už 340 žetonů.',n:1},{w:'Tomáš',d:'15. 11.',t:'Spoření má od pondělí úrok 5 %. Peníze na spoření najdeš na kartě Účet.'}]};
const me=()=>TEAM.find(p=>p.n===S.me);
const ROLES={cust:'Zákazník',vice:'Zástupce',gfx:'Grafik',dev:'Vývojář',own:'Majitel',bank:'Banka'};
/* Vývojář má skoro všechno jako majitel – jen nevidí Banku (pokud ho majitel nepřidá) a nemůže určovat, kdo Banku vidí. */
const can={
 approve:()=>['bank','own','vice','dev','gfx'].includes(S.role),
 editAcct:()=>['own','dev'].includes(S.role),
 seeBank:()=>['own','bank'].includes(S.role)||S.bankAccess.includes(S.me),
 manageBank:()=>S.role==='own',
 payFromBank:()=>['own','bank'].includes(S.role),
};
const visible=()=>TEAM.filter(p=>!p.hidden);
function fund(a,t,who){S.fund=Math.round((S.fund+a)*100)/100;S.fundTx.unshift({t,w:who||S.me,a,d:'Teď'});S.fundHist.push(S.fund);if(S.fundHist.length>40)S.fundHist.shift()}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const I=(n,c='')=>`<svg class="ico ${c}"><use href="#i-${n}"/></svg>`;
const fN=n=>n.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>fN(n)+' Sh';
const f0=n=>Math.round(n).toLocaleString('cs-CZ')+' Sh';
const pv=()=>Object.entries(S.hold).reduce((s,[id,q])=>s+q*((ST.find(x=>x.id===id)||{p:0}).p),0);
const card=id=>CARDS.find(c=>c.id===id)||CARDS[0];
function greet(){const h=new Date().getHours();return h<10?'Dobré ráno':h<18?'Dobrý den':'Dobrý večer'}
let tt;function toast(m,ok=true){const t=$('#toast');t.className='toast show '+(ok?'ok':'err');t.innerHTML=I(ok?'check':'x')+m;clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2600)}
function addTx(k,t,d,a){S.tx.unshift({k,t,d:'Teď · '+d,a})}
function chart(h,w=300,hh=110){const mn=Math.min(...h),mx=Math.max(...h),sx=w/(h.length-1);const pts=h.map((v,i)=>`${(i*sx).toFixed(1)} ${(hh-8-(v-mn)/(mx-mn||1)*(hh-20)).toFixed(1)}`);return `<svg class="chart" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><path d="M${pts.join(' L')} V${hh} H0Z" fill="url(#fill)"/><path d="M${pts.join(' L')}" fill="none" stroke="url(#gg)" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`}
function pc(cls=''){const p=me(),c=card(p.card);return `<div class="pc ${cls}" style="background:${c.bg}"><div class="t"><span>NašeBanka</span>${c.custom?'<span class="tag">CUSTOM</span>':'<div class="chip"></div>'}</div><div class="n">Účet ${p.acct}</div><div class="b"><span>${p.n.toUpperCase()}</span><span>${c.n.replace(/ ·.*/,'')}</span></div></div>`}
const TXI={in:['recv','p'],out:['send','n'],int:['gift','p'],chip:['swap',''],inv:['chart',''],loan:['loan','']};
function txRow(t){const[i,c]=TXI[t.k]||['swap',''];return `<div class="tx"><div class="ic ${c}">${I(i)}</div><div class="m"><b>${t.t}</b><small>${t.d}</small></div><div class="a ${t.a>=0?'pos':'neg'}">${t.a>=0?'+':'−'}${fN(Math.abs(t.a))}</div></div>`}
function topBar(title,sub){return `<div class="topb"><div class="tt">${sub?`<small>${sub}</small>`:''}<h1>${title}</h1></div><a class="ibtn" href="#/oznameni" aria-label="Oznámení">${I('bell')}${S.unread?'<span class="dot"></span>':''}</a><a class="av" href="#/nastaveni" aria-label="Profil">${S.me[0]}</a></div>`}
function pfHist(){const e=Object.entries(S.hold).filter(([id,q])=>q>0&&stk(id));if(!e.length)return [0,0];const L=Math.min(...e.map(([id])=>stk(id).h.length));return Array.from({length:L},(_,i)=>e.reduce((s,[id,q])=>{const h=stk(id).h;return s+q*h[h.length-L+i]},0))}
function holdings(){const e=Object.entries(S.hold).filter(([,q])=>q>0);if(!e.length)return '<div class="empty">Zatím nic nevlastníš.</div>';return e.map(([id,q])=>{const s=stk(id);if(!s)return '';const ch=chg(s);return `<div class="stock"><span>${s.n}<small>${q} ks · ${fmt(q*s.p)}</small></span><b class="${ch>=0?'pos':'neg'}">${pct(ch)}</b></div>`}).join('')}

/* ---------- pages ---------- */
function navList(){const L=S.role==='bank'?[['banka','Banka','vault'],['zadosti','Žádosti','inbox'],null,['tym','Tým','team'],['oznameni','Oznámení','bell'],['nastaveni','Nastavení','cog']]:NAV.slice();
 if(S.role!=='bank'){const extra=[];if(can.seeBank())extra.push(['banka','Banka','vault']);if(can.approve())extra.push(['zadosti','Žádosti','inbox']);if(extra.length)L.push(null,...extra)}return L}
const NAV=[['ucet','Účet','home'],['platby','Platby','send'],['pujcky','Půjčky','loan'],['kasino','Kasino','dice'],['burza','Burza','chart'],null,['tym','Tým','team'],['oznameni','Oznámení','bell'],['nastaveni','Nastavení','cog']];
const P={};
P.ucet=()=>`${topBar(S.me,greet())}
<div class="r1"><section class="glass box bal"><small>Zůstatek na účtu ${me().acct}</small><div class="num gtext">${fmt(S.bal)}</div>
<div class="pills"><a class="pill" href="#/ucet" data-act="focusSav">Spoření<b>${f0(S.sav)}</b></a><a class="pill" href="#/kasino">Žetony<b>${S.chips} ž.</b></a><a class="pill" href="#/burza">Portfolio<b>${f0(pv())}</b></a><a class="pill" href="#/pujcky">Půjčka<b>${S.loan?f0(S.loan.debt):'0 Sh'}</b></a></div></section>${pc('home')}</div>
<section class="glass qbox"><div class="qa">
<a class="q p" href="#/platby"><span>${I('send')}</span>Poslat</a><button class="q" data-act="focusSav"><span>${I('save')}</span>Spořit</button><a class="q" href="#/pujcky"><span>${I('loan')}</span>Půjčit</a><a class="q" href="#/kasino"><span>${I('dice')}</span>Kasino</a><a class="q" href="#/burza"><span>${I('chart')}</span>Burza</a></div></section>

function pickRow(p,act){return `<button type="button" class="pick-row ${S.pre===p.n?'on':''} ${act?'act':''}" data-act="pick" data-v="${p.n}" role="option"><span class="av s">${p.n[0]}</span><span class="m"><b>${p.n}</b><small>${p.r}${card(p.card).custom?' · custom karta':''}</small></span>${S.pre===p.n?I('check','ok'):''}</button>`}
function pickRows(q=''){q=norm(q.trim());const others=visible().filter(p=>p.n!==S.me);

 const list=others.filter(p=>norm(p.n).includes(q)||p.acct.startsWith(q)||norm(p.r).includes(q));

/* půjčky – podle Mátyho opravy (commit 285ac7a): max 10 000 Sh, automatické splátky, první splátka nejpozději za 6 měsíců */
const LF=()=>1+S.cfg.loanFee/100,FREQ={monthly:'Každý měsíc',weekly:'Každý týden',daily:'Každý den'};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const cz=s=>new Date(s+'T12:00:00').toLocaleDateString('cs-CZ');
function dateMin(){const d=new Date();if(d.getHours()>=20)d.setDate(d.getDate()+1);return iso(d)}
function dateMax(){const d=new Date();d.setMonth(d.getMonth()+6);return iso(d)}
function nextDate(s,f,anchor){const d=new Date(s+'T12:00:00');if(f==='monthly'){d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(anchor,last))}else d.setDate(d.getDate()+(f==='weekly'?7:1));return iso(d)}
function schedule(debt,amt,date,f){const rows=[];if(!(amt>0)||!date)return rows;const anchor=+date.slice(8);let left=Math.round(debt*100)/100,d=date;while(left>0&&rows.length<400){const a=Math.min(amt,left);left=Math.round((left-a)*100)/100;rows.push({d,a,left});d=nextDate(d,f,anchor)}return rows}
function schedHtml(debt,p){const r=schedule(debt,p.amt,p.date,p.freq);if(!r.length)return '<div class="empty">Vyplň splátku a datum, ukážu ti plán.</div>';
 return `<div class="kv"><span>Počet splátek</span><b>${r.length}×</b></div><div class="kv"><span>Poslední splátka</span><b>${cz(r[r.length-1].d)}</b></div>
 <div class="pick-h" style="padding-left:0">Splátky</div>${r.slice(0,6).map((x,i)=>`<div class="stock"><span>${cz(x.d)} · 20:00<small>${i===0?'první splátka':'zbývá potom '+fmt(x.left)}</small></span><b>${fmt(x.a)}</b></div>`).join('')}${r.length>6?`<p class="mute sm" style="margin:8px 0 0">… a dalších ${r.length-6} splátek</p>`:''}`}
function planFields(p){return `<label class="field">Automatická splátka (Sh)<input id="plAmt" type="number" min="0.01" step="0.01" value="${p.amt}" inputmode="decimal"></label>
<div class="g2" style="gap:12px"><label class="field">První splátka (ve 20:00)<input id="plDate" type="date" min="${dateMin()}" max="${dateMax()}" value="${p.date}"></label>
<label class="field">Jak často<select id="plFreq">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}" ${p.freq===k?'selected':''}>${v}</option>`).join('')}</select></label></div>`}
function readPlan(debt){const amt=num('#plAmt'),date=$('#plDate').value,freq=$('#plFreq').value;
 if(!(amt>0))throw 'Zadej automatickou splátku.';if(amt>debt)throw 'Splátka nemůže být větší než dluh ('+fmt(debt)+').';
 if(!date||date<dateMin())throw 'Datum první splátky už proběhlo.';if(date>dateMax())throw 'První splátka může být nejpozději '+cz(dateMax())+' (za 6 měsíců).';return {amt,date,freq}}
